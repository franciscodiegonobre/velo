# Workflow de Integração Contínua focado em testes unitários com Vitest
# Estrutura base preparada para expansão futura de novos jobs e etapas

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE}}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      # 1. checkout of the repo code from github  
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      # 2. setup of the node.js version defined in the environment
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Install dependencies of the project
      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  build-and-deploy:
    name: Build and Deploy Vercel Preview
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      # 1. checkout of the repo code from github  
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      # 2. setup of the node.js version defined in the environment
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Install dependencies of the project
      - name: Install dependencies
        run: npm ci

      # 4. Obtain Vercel configs 
      - name: Pull Vercel Config
        run: yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE

      # 5. Build to Vercel
      - name: Build to Vercel
        run: npx vercel build --token=$VERCEL_TOKEN

      # 6. Deploy Preview in Vercel
      - name: Deploy Preview
        run: npx vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE