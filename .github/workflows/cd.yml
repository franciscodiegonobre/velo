# Workflow de Deployment Contínuo focado em testes unitários e E2E isolados por ambiente

name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_SCOPE: velo-65ff
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      # 2. Configuração do Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Instalação de dependências
      - name: Install dependencies
        run: npm ci

      # 4. Execução dos testes unitários
      - name: Run unit tests
        run: npm test

  build-and-deploy:
    name: Build and Deploy Vercel Preview
    needs: unit-tests
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      # 2. Configuração do Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Instalação de dependências
      - name: Install dependencies
        run: npm ci

      # 4. Baixa as configurações e variáveis de PREVIEW
      - name: Pull Vercel Config
        run: npx vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE

      # 5. Compila o bundle apontando para o Supabase Preview
      - name: Build to Vercel
        run: npx vercel build --token=$VERCEL_TOKEN

      # 6. Faz o deploy do Preview na Vercel
      - name: Deploy Preview
        id: deploy
        run: |
          URL=$(npx --silent vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE)
          echo "deployment-url=${URL}" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run End-to-End Tests
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      # 2. Configuração do Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Instalação de dependências
      - name: Install dependencies
        run: npm ci

      # 4. Instalação dos navegadores do Playwright
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 5. Execução dos testes E2E contra a URL de Preview
      - name: Run end-to-end tests
        run: npx playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}
          PLAYWRIGHT_DATABASE_URL: ${{ secrets.PLAYWRIGHT_DATABASE_URL }}
          TESTDINO_TOKEN: ${{ secrets.TD_TOKEN }}

      # 6. Upload do relatório do Playwright
      - name: Upload Report results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report

  deploy-production:
    name: Build and Deploy to Production
    needs: [build-and-deploy, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      # 2. Configuração do Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Instalação de dependências
      - name: Install dependencies
        run: npm ci

      # 4. Baixa as configurações e variáveis de PRODUÇÃO
      - name: Pull Vercel Production Config
        run: npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE

      # 5. Compila um novo bundle injetando os valores das variáveis de Produção
      - name: Build for Production
        run: npx vercel build --prod --token=$VERCEL_TOKEN

      # 6. Realiza o deploy final para o ambiente de Produção
      - name: Deploy to Production
        run: npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE